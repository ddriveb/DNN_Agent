# Agent 超参数配置

network:
  input_dim: 64          # x_t 维度 + z_t 维度
  hidden_dims: [256, 128]
  output_dim: 64         # 动作空间大小（根据实际调整）
  dueling: true
  double_dqn: true

training:
  lr: 1e-4
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 100000
  buffer_size: 100000
  batch_size: 64
  target_update_freq: 1000

z_dimension: 15
