# ------------------------------------------------------------------
# Initial spectrum state
# ------------------------------------------------------------------
initial_spectrum:
  load_factor: 0.6
  fragmentation_levels: [0.2, 0.5]

# ------------------------------------------------------------------
# Server parameters (from Table 2)
# ------------------------------------------------------------------
server_params:
  load_range_hz: [3.0e8, 13.0e8]
  capacity_range_hz_per_s: [2.0e10, 5.0e10]

# ------------------------------------------------------------------
# DNN request parameters (from Table 2)
# ------------------------------------------------------------------
dnn_requests:
  request_numbers: [15, 20, 25, 30, 35, 40, 45, 50, 55, 60]
  deadline_ms_range: [20, 40]
  subtask_num_range: [1, 5]
  subtask_compute_range_hz: [1.0e7, 1.5e7]
  subtask_data_range_bits: [8.0e7, 6.0e8]
  data_size_order: decreasing_with_depth
  partition_once: true

# ------------------------------------------------------------------
# Routing & spectrum allocation
# ------------------------------------------------------------------
routing_spectrum:
  baseline_path_rule: shortest_path
  baseline_slot_rule: first_fit
  k_paths: 3
  spectrum_constraints:
    continuity: true
    contiguity: true
    non_overlap: true

# ------------------------------------------------------------------
# Methods to evaluate
# ------------------------------------------------------------------
methods:
  - WO
  - DF
  - RF
  - IWD-Approx
  - YinLike
  - TopK2-30D
  - CorrectionNet

# ------------------------------------------------------------------
# Metrics to record
# ------------------------------------------------------------------
metrics:
  - blocking_probability
  - average_inference_time
  - acceptance_rate
  - throughput
  - average_computation_delay
  - average_transmission_delay
  - spectrum_utilization
  - fragmentation_index
  - decision_latency

# ------------------------------------------------------------------
# Repetitions
# ------------------------------------------------------------------
repetitions:
  seeds: 5
