# 环境生成配置
# 第一版：2 拓扑 × 3 负载 × 3 碎片 = 18 个环境

topologies:
  - name: "NSFNET"
    nodes: 14
    edges: 21
    source: "builtin"
  - name: "GEANT"
    nodes: 22
    edges: 36
    source: "builtin"

spectrum:
  total_slots: 320
  slot_width_ghz: 12.5
  guard_band_slots: 1

load_levels: ["low", "medium", "high"]
fragmentation_levels: ["low", "medium", "high"]

mec_servers:
  count_range: [3, 5]
  compute_capacity_range: [20, 100]  # GFLOPS
  memory_capacity_range: [8, 32]     # GB

traffic:
  request_arrival_rate_range: [5, 50]   # requests / time unit
  dnn_models: ["ResNet18", "MobileNetV2", "BERT-tiny"]
  data_size_range: [0.1, 10.0]          # MB
  delay_constraint_range: [50, 500]     # ms
